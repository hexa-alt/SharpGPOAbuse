name: Build SharpGPOAbuse

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'   # adjust if project targets older framework

      # Restore dependencies
      - name: Restore
        run: dotnet restore SharpGPOAbuse.sln

      # Build solution
      - name: Build
        run: dotnet build SharpGPOAbuse.sln --configuration Release --no-restore

      # Upload build artifacts (UPDATED TO v4)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SharpGPOAbuse-bin
          path: |
            **/bin/Release/**/*.exe
            **/bin/Release/**/*.dll
