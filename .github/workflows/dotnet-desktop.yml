name: Build SharpGPOAbuse

# Trigger on push and PR
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      # 1) Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2) Setup .NET SDK (adjust version if needed)
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'

      # 3) Restore dependencies
      - name: Restore NuGet packages
        run: dotnet restore SharpGPOAbuse.sln

      # 4) Build solution in Release config
      - name: Build solution
        run: dotnet build SharpGPOAbuse.sln --configuration Release --no-restore

      # 5) Publish artifacts (optional)
      - name: Publish build output
        uses: actions/upload-artifact@v3
        with:
          name: SharpGPOAbuse-bin
          path: SharpGPOAbuse/**/bin/Release/
